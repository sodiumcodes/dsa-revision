    if d > dist[u]: continue
    for (v, weight) in graph[u]:

UNION(i, j):

                    <ul className="list-disc pl-5 space-y-2 text-sm font-medium">
                      <li><strong>Use <code className="bg-white px-1 border border-black">unordered_map</code></strong> when you only need fast O(1) average key lookups and key order does NOT matter.</li>
                      <li><strong>Use <code className="bg-white px-1 border border-black">std::map</code></strong> when you need keys in sorted order or require <code className="bg-white px-1 border border-black">lower_bound()</code> / range queries.</li>
                    </ul>
                  </div>

                  <div className="border-2 border-black p-5 bg-cyan-50 neo-box-sm">
                    <h3 className="text-lg font-black uppercase mb-2 text-black border-b-2 border-black pb-1">
                      2. Deque vs Vector
                    </h3>
                    <ul className="list-disc pl-5 space-y-2 text-sm font-medium">
                      <li><strong>Vector:</strong> Best cache locality for linear scans; fast random access; push_back is amortized O(1).</li>
                      <li><strong>Deque:</strong> Supports both <code className="bg-white px-1 border border-black">push_front</code> and <code className="bg-white px-1 border border-black">push_back</code> in O(1) time. Essential for sliding window maximums.</li>
                    </ul>
                  </div>

                  <div className="border-2 border-black p-5 bg-emerald-50 neo-box-sm">
                    <h3 className="text-lg font-black uppercase mb-2 text-black border-b-2 border-black pb-1">
                      3. Graph Representation Selection
                    </h3>
                    <ul className="list-disc pl-5 space-y-2 text-sm font-medium">
                      <li><strong>Adjacency List:</strong> Always default to this for sparse graphs (E &lt;&lt; V²). Space efficiency O(V + E).</li>
                      <li><strong>Adjacency Matrix:</strong> Use when V is very small (V ≤ 1000) or when constant-time O(1) edge lookup is required.</li>
                    </ul>
                  </div>

                  <div className="border-2 border-black p-5 bg-pink-50 neo-box-sm">
                    <h3 className="text-lg font-black uppercase mb-2 text-black border-b-2 border-black pb-1">
                      4. Heap Direction
                    </h3>
                    <ul className="list-disc pl-5 space-y-2 text-sm font-medium">
                      <li>C++ <code className="bg-white px-1 border border-black">std::priority_queue</code> defaults to a <strong>MAX-HEAP</strong>.</li>
                      <li>To create a MIN-HEAP, pass <code className="bg-white px-1 border border-black">priority_queue&lt;T, vector&lt;T&gt;, greater&lt;T&gt;&gt;</code>.</li>
                    </ul>
                  </div>
                </div>
              </div>
            </main>
          )}

            ⚡ Clean C++ Data Structures & Algorithms Reference • Neo-Brutalist Interactive Edition
          </footer>

        </div>
      );
