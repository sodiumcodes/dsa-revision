      border: 2px solid #000;

      border: 2px solid #000;

    ];

    const CHEAT_SHEET_ROWS = [
      { op: "Access by index", struct: "array, vector, string, deque", cost: "O(1)", tag: "green", watch: "Not supported by list, set, map, stack, queue." },
      { op: "Append at end", struct: "vector", cost: "Amortized O(1)", tag: "green", watch: "A resize/reallocation can make one append O(n)." },
      { op: "Insert/delete at known position", struct: "list", cost: "O(1) with iterator", tag: "green", watch: "Finding the position may still take O(n)." },
      { op: "Membership / key lookup", struct: "unordered_set / map", cost: "Average O(1), Worst O(n)", tag: "yellow", watch: "Use set/map for ordered keys & O(log n) guarantees." },
      { op: "Maintain sorted unique values", struct: "set", cost: "O(log n) insert/find/erase", tag: "blue", watch: "Duplicates removed; use multiset if duplicates matter." },
      { op: "Repeated min/max", struct: "priority_queue", cost: "top O(1), push/pop O(log n)", tag: "blue", watch: "Default priority_queue is a max-heap." },
      { op: "FIFO / LIFO", struct: "queue / stack", cost: "Core operations O(1)", tag: "green", watch: "BFS usually uses queue; DFS uses recursion or stack." },
      { op: "Range sum + point update", struct: "Fenwick tree", cost: "O(log n)", tag: "blue", watch: "Usually 1-indexed; range sum via prefix differences." },
      { op: "Flexible range query/update", struct: "Segment tree", cost: "O(log n) per query/update", tag: "blue", watch: "Lazy propagation required for range updates." },
      { op: "Static range min/max", struct: "Sparse table", cost: "O(1) query, O(n log n) build", tag: "green", watch: "Best when the array does not change." },
      { op: "Dynamic connectivity / groups", struct: "DSU", cost: "Amortized O(α(n))", tag: "green", watch: "Great for incremental merges; no arbitrary edge deletion." },
      { op: "Unweighted shortest path", struct: "Graph + BFS queue", cost: "O(V + E) with adj list", tag: "orange", watch: "Weighted shortest paths need Dijkstra or Bellman-Ford." },
      { op: "Prefix matching (words)", struct: "Trie", cost: "O(L) per word/query", tag: "purple", watch: "Can use substantial memory depending on alphabet." }
    ];

    const CATEGORIES = ["All", "Sequence Containers", "Adapters & Stacks", "Associative Containers", "Trees & Advanced", "Graphs & Networks", "Range Queries", "Algorithmic Patterns"];

    // Main App Component
    function App() {
      const [search, setSearch] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [activeTab, setActiveTab] = useState("cards"); // 'cards' | 'matrix' | 'rules'

      const handleCopy = (text, id) => {
        navigator.clipboard.writeText(text);
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 2000);

      const filteredItems = useMemo(() => {
        return DATA_STRUCTURES.filter(item => {
          const matchesCat = selectedCategory === "All" || item.category === selectedCategory;
          const query = search.toLowerCase();
          const matchesSearch = !query || 
            item.name.toLowerCase().includes(query) ||
            item.syntax.toLowerCase().includes(query) ||
            item.explanation.toLowerCase().includes(query) ||
            item.keywords.some(k => k.toLowerCase().includes(query)) ||
            item.notes.toLowerCase().includes(query);

      }, [search, selectedCategory]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
          
          {/* Top Banner Header */}
          <header className="mb-8">
            <div className="bg-[#FFE600] neo-box p-6 sm:p-8 relative overflow-hidden">
              <div className="absolute right-3 top-3 opacity-15 hidden md:block select-none pointer-events-none">
                <span className="text-9xl font-black font-mono">C++</span>
              </div>
              
              <div className="flex flex-wrap items-center justify-between gap-4 relative z-10">
                <div>
                  <div className="inline-block bg-black text-white px-3 py-1 font-mono text-xs font-bold uppercase tracking-wider mb-2 neo-pill">
                    ⚡ Interview & Competitive Programming Reference
                  </div>
                  <h1 className="text-3xl sm:text-5xl font-black tracking-tight text-black uppercase">
                    C++ Data Structures <br className="hidden sm:inline" />
                    <span className="bg-white px-2 py-0.5 border-2 border-black inline-block mt-1">
                      & Complexity Guide
                    </span>
                  </h1>
                </div>

                <div className="flex flex-col sm:flex-row gap-3">
                  <button 
                    onClick={() => setActiveTab('cards')}
                    className={`neo-btn px-4 py-2.5 font-bold flex items-center gap-2 text-sm ${
                      activeTab === 'cards' ? 'bg-black text-white' : 'bg-white text-black'
                    }`}
                  >
                    <GridIcon /> Reference Cards ({DATA_STRUCTURES.length})
                  </button>
                  <button 
                    onClick={() => setActiveTab('matrix')}
                    className={`neo-btn px-4 py-2.5 font-bold flex items-center gap-2 text-sm ${
                      activeTab === 'matrix' ? 'bg-black text-white' : 'bg-white text-black'
                    }`}
                  >
                    <TableIcon /> Operations Matrix
                  </button>
                  <button 
                    onClick={() => setActiveTab('rules')}
                    className={`neo-btn px-4 py-2.5 font-bold flex items-center gap-2 text-sm ${
                      activeTab === 'rules' ? 'bg-black text-white' : 'bg-white text-black'
                    }`}
                  >
                    <BookIcon /> Key Rules
                  </button>
                </div>
              </div>

              {/* Variable Notation Legend */}
              <div className="mt-6 pt-4 border-t-2 border-black grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 text-xs font-bold font-mono">
                <div className="bg-white p-1.5 border border-black text-center shadow-[2px_2px_0px_0px_#000]">
                  <span className="text-rose-600 font-extrabold">n</span> = elements
                </div>
                <div className="bg-white p-1.5 border border-black text-center shadow-[2px_2px_0px_0px_#000]">
                  <span className="text-rose-600 font-extrabold">V</span> = vertices
                </div>
                <div className="bg-white p-1.5 border border-black text-center shadow-[2px_2px_0px_0px_#000]">
                  <span className="text-rose-600 font-extrabold">E</span> = edges
                </div>
                <div className="bg-white p-1.5 border border-black text-center shadow-[2px_2px_0px_0px_#000]">
                  <span className="text-rose-600 font-extrabold">h</span> = tree height
                </div>
                <div className="bg-white p-1.5 border border-black text-center shadow-[2px_2px_0px_0px_#000]">
                  <span className="text-rose-600 font-extrabold">L</span> = key length
                </div>
                <div className="bg-white p-1.5 border border-black text-center shadow-[2px_2px_0px_0px_#000]">
                  <span className="text-rose-600 font-extrabold">U</span> = universe size
                </div>
              </div>
            </div>
          </header>

          {/* Search & Category Filter Bar */}
          {activeTab !== 'rules' && (
            <div className="mb-8 space-y-4">
              <div className="flex flex-col md:flex-row gap-4">
                <div className="relative flex-1">
                  <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <SearchIcon />
                  </div>
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Search structure, syntax, keywords (e.g. 'BFS', 'sliding window', 'prefix sum', 'O(1)')..."
                    className="w-full pl-11 pr-4 py-3 bg-white neo-box font-medium focus:outline-none focus:ring-2 focus:ring-black placeholder-gray-500"
                  />
                  {search && (
                    <button 
                      onClick={() => setSearch("")}
                      className="absolute right-3 top-3 font-mono font-bold text-xs bg-black text-white px-2 py-1 rounded"
                    >
                      CLEAR
                    </button>
                  )}
                </div>
              </div>

              {/* Category Pills */}
              <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3 py-1.5 text-xs font-black uppercase whitespace-nowrap neo-pill transition-all ${
                      selectedCategory === cat 
                        ? 'bg-black text-white translate-x-[1px] translate-y-[1px] shadow-none' 
                        : 'bg-white text-black hover:bg-yellow-200'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* MAIN CONTENT AREA */}
          {activeTab === 'cards' && (
            <main>
              {filteredItems.length === 0 ? (
                <div className="bg-white neo-box p-12 text-center my-12">
                  <AlertIcon />
                  <h3 className="text-2xl font-black mt-2">No matching data structures found</h3>
                  <p className="text-gray-600 font-medium mt-1">Try relaxing your search terms or clearing category filters.</p>
                  <button 
                    onClick={() => { setSearch(""); setSelectedCategory("All"); }}
                    className="mt-4 neo-btn px-4 py-2 bg-[#FFE600] font-bold text-sm"
                  >
                    Reset All Filters
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredItems.map((item) => (
                    <div 
                      key={item.id}
                      className="bg-white neo-box flex flex-col justify-between overflow-hidden hover:translate-x-[-2px] hover:translate-y-[-2px] transition-all"
                    >
                      {/* Card Header */}
                      <div>
                        <div 
                          className="p-4 border-b-3 border-black flex items-start justify-between gap-2"
                          style={{ backgroundColor: item.bgColor }}
                        >
                          <div>
                            <span className="text-[10px] font-mono font-extrabold uppercase bg-black text-white px-2 py-0.5 border border-black inline-block mb-1">
                              {item.category}
                            </span>
                            <h3 className="text-xl font-black text-black tracking-tight leading-tight">
                              {item.name}
                            </h3>
                          </div>
                          <ZapIcon />
                        </div>

                        {/* Explanation */}
                        <div className="p-4 border-b-2 border-black bg-neutral-50 text-xs font-semibold text-gray-800">
                          {item.explanation}
                        </div>

                        {/* C++ Code Snippet Box */}
                        <div className="p-4 border-b-2 border-black bg-[#1e1e1e] text-white relative group">
                          <div className="flex justify-between items-center mb-1 text-[10px] font-mono text-gray-400 border-b border-gray-700 pb-1">
                            <span>C++ SYNTAX</span>
                            <button
                              onClick={() => handleCopy(item.syntax, item.id)}
                              className="text-white hover:text-yellow-400 flex items-center gap-1 bg-gray-800 px-2 py-0.5 rounded border border-gray-600"
                              title="Copy Syntax"
                            >
                              {copiedId === item.id ? (
                                <>
                                  <CheckIcon /> <span className="text-green-400">COPIED</span>
                                </>
                              ) : (
                                <>
                                  <CopyIcon /> COPY
                                </>
                              )}
                            </button>
                          </div>
                          <pre className="font-mono text-xs overflow-x-auto text-green-400 py-1 font-semibold leading-relaxed">
                            {item.syntax}
                          </pre>
                        </div>

                        {/* Time & Space Matrix Grid */}
                        <div className="p-4 border-b-2 border-black bg-white space-y-3">
                          <div className="text-xs font-black uppercase text-black font-mono tracking-wider border-b border-black pb-1">
                            ⏱️ Complexities Overview
                          </div>
                          <div className="grid grid-cols-2 gap-2 text-xs">
                            <div className="bg-neutral-100 p-2 border border-black">
                              <span className="block text-[10px] font-mono text-gray-500 uppercase">Access / Search</span>
                              <span className="font-mono font-bold text-black">{item.time.access}</span>
                            </div>
                            <div className="bg-neutral-100 p-2 border border-black">
                              <span className="block text-[10px] font-mono text-gray-500 uppercase">Insert / Delete</span>
                              <span className="font-mono font-bold text-black">{item.time.insertDelete}</span>
                            </div>
                          </div>
                          
                          <div className="text-xs font-mono bg-yellow-50 p-2 border border-black">
                            <span className="font-bold text-black">Space: </span>
                            <span className="text-gray-900">{item.space}</span>
                          </div>

                          <div className="text-xs text-gray-800 font-medium leading-normal bg-neutral-50 p-2 border border-black">
                            <strong className="text-black font-bold">Details: </strong>
                            {item.opCosts}
                          </div>
                        </div>

                        {/* Question Clues / Keywords */}
                        <div className="p-4 border-b-2 border-black bg-white">
                          <div className="text-xs font-black uppercase text-black font-mono mb-2">
                            🔎 Question Clues / Keywords:
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {item.keywords.map(kw => (
                              <button
                                key={kw}
                                onClick={() => setSearch(kw)}
                                className="text-[11px] font-mono font-bold bg-white text-black px-2 py-0.5 border border-black hover:bg-yellow-300 shadow-[1px_1px_0px_0px_#000]"
                              >
                                #{kw}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Important Notes / Caveats Footer */}
                      <div className="p-4 bg-amber-100 border-t-2 border-black text-xs font-medium">
                        <div className="flex items-center gap-1 font-bold text-black uppercase mb-1 font-mono">
                          <AlertIcon /> Important Caveat
                        </div>
                        <p className="text-black leading-tight">
                          {item.notes}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* CHEAT SHEET MATRIX TABLE TAB */}
          {activeTab === 'matrix' && (
            <main className="bg-white neo-box p-4 sm:p-6 overflow-x-auto">
              <div className="mb-4">
                <h2 className="text-2xl font-black uppercase">Operation Complexity Cheat Sheet</h2>
                <p className="text-sm text-gray-600 font-medium">Quick reference matching standard algorithm tasks to their ideal C++ data structure & Big-O cost.</p>
              </div>

              <table className="w-full text-left border-collapse border-2 border-black font-mono text-xs">
                <thead>
                  <tr className="bg-[#FFE600] border-b-2 border-black text-black font-extrabold text-sm">
                    <th className="p-3 border-r-2 border-black">Operation / Pattern</th>
                    <th className="p-3 border-r-2 border-black">Typical C++ Structure</th>
                    <th className="p-3 border-r-2 border-black">Typical Cost</th>
                    <th className="p-3">Watch Out For / Key Details</th>
                  </tr>
                </thead>
                <tbody className="divide-y-2 divide-black">
                  {CHEAT_SHEET_ROWS.map((row, idx) => (
                    <tr key={idx} className={idx % 2 === 0 ? "bg-white" : "bg-neutral-50"}>
                      <td className="p-3 font-bold text-black border-r-2 border-black">
                        {row.op}
                      </td>
                      <td className="p-3 font-semibold text-blue-900 border-r-2 border-black bg-blue-50/50">
                        {row.struct}
                      </td>
                      <td className="p-3 font-bold border-r-2 border-black">
                        <span className={`inline-block px-2 py-1 border border-black ${
                          row.tag === 'green' ? 'bg-green-300 text-black' :
                          row.tag === 'blue' ? 'bg-cyan-200 text-black' :
                          row.tag === 'purple' ? 'bg-purple-200 text-black' :
                          row.tag === 'yellow' ? 'bg-yellow-200 text-black' :
                          'bg-orange-200 text-black'
                        }`}>
                          {row.cost}
                        </span>
                      </td>
                      <td className="p-3 text-gray-800 font-medium font-sans text-xs">
                        {row.watch}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </main>
          )}

          {/* KEY RULES & GUIDELINES TAB */}
          {activeTab === 'rules' && (
            <main className="space-y-6">
              <div className="bg-white neo-box p-6 sm:p-8">
                <h2 className="text-3xl font-black uppercase mb-4 flex items-center gap-2">
                  <ZapIcon /> Complexity & Correctness Rules
                </h2>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  
                  <div className="border-2 border-black p-5 bg-yellow-50 neo-box-sm">
                    <h3 className="text-lg font-black uppercase mb-2 text-black border-b-2 border-black pb-1">
                      1. Big-O & Bound Basics
                    </h3>
                    <ul className="list-disc pl-5 space-y-2 text-sm font-medium">
                      <li><strong>Big-O is an upper bound:</strong> It describes worst-case asymptotic scaling unless explicitly specified as average/expected.</li>
                      <li><strong>Average vs Worst-case:</strong> Hash table operations (<code className="bg-white px-1 border border-black">unordered_map</code>) offer <em>expected</em> O(1) time, but worst-case is O(n) due to collisions. Balanced trees (<code className="bg-white px-1 border border-black">std::set</code>) guarantee worst-case O(log n).</li>
                      <li><strong>Amortized Time:</strong> Not the same as worst-case! For instance, <code className="bg-white px-1 border border-black">vector::push_back</code> is amortized O(1), but a dynamic array expansion step costs O(n).</li>
                    </ul>
                  </div>

                  <div className="border-2 border-black p-5 bg-cyan-50 neo-box-sm">
                    <h3 className="text-lg font-black uppercase mb-2 text-black border-b-2 border-black pb-1">
                      2. Space & Auxiliary Memory
                    </h3>
                    <ul className="list-disc pl-5 space-y-2 text-sm font-medium">
                      <li><strong>Auxiliary Space vs Total Space:</strong> Total space includes data storage O(n). Auxiliary space measures <em>extra</em> memory required by a specific operation algorithm.</li>
                      <li><strong>Call Stack Space:</strong> Recursive traversals (DFS, BST operations) use implicit system call stack space proportional to depth $O(h)$, which degrades to $O(n)$ in unbalanced/skewed trees.</li>
                    </ul>
                  </div>

                  <div className="border-2 border-black p-5 bg-pink-50 neo-box-sm">
                    <h3 className="text-lg font-black uppercase mb-2 text-black border-b-2 border-black pb-1">
                      3. Quick Selection Rule
                    </h3>
                    <p className="text-sm font-medium leading-relaxed">
                      First identify the single operation that <strong>MUST</strong> be fast:
                    </p>
                    <div className="mt-2 space-y-1 text-xs font-mono">
                      <div className="bg-white p-2 border border-black">• Index Random Access ➔ <strong>std::vector / Array</strong></div>
                      <div className="bg-white p-2 border border-black">• Fast Key Lookup ➔ <strong>std::unordered_map</strong></div>
                      <div className="bg-white p-2 border border-black">• Predecessor / Range Search ➔ <strong>std::set / std::map</strong></div>
                      <div className="bg-white p-2 border border-black">• Repeated Extremum (Min/Max) ➔ <strong>std::priority_queue</strong></div>
                      <div className="bg-white p-2 border border-black">• Dynamic Range Sum / Point Update ➔ <strong>Fenwick Tree</strong></div>
                      <div className="bg-white p-2 border border-black">• Range Query & Lazy Range Update ➔ <strong>Segment Tree</strong></div>
                    </div>
                  </div>

                  <div className="border-2 border-black p-5 bg-emerald-50 neo-box-sm">
                    <h3 className="text-lg font-black uppercase mb-2 text-black border-b-2 border-black pb-1">
                      4. C++ STL Traps to Avoid
                    </h3>
                    <ul className="list-disc pl-5 space-y-2 text-sm font-medium">
                      <li><code className="bg-white px-1 border border-black">std::multiset::erase(val)</code> deletes <strong>ALL</strong> occurrences of <code className="bg-white px-1 border border-black">val</code>! To delete just one, pass an iterator: <code className="bg-white px-1 border border-black">ms.erase(ms.find(val))</code>.</li>
                      <li><code className="bg-white px-1 border border-black">map[key]</code> inserts a default value if key is missing! Use <code className="bg-white px-1 border border-black">find()</code> or <code className="bg-white px-1 border border-black">count()</code> for read-only checks.</li>
                      <li><code className="bg-white px-1 border border-black">stack.pop()</code> returns <code className="bg-white px-1 border border-black">void</code> in C++ standard library. Always read <code className="bg-white px-1 border border-black">stack.top()</code> before popping!</li>
                    </ul>
                  </div>

                </div>
              </div>
            </main>
          )}

          {/* Footer */}
          <footer className="mt-12 text-center text-xs font-mono font-bold text-gray-700 bg-white neo-box p-4">
            ⚡ C++ Data Structures & Complexity Cheat Sheet • Built with Neo-Brutalism Design • Fast Interview & Competitive Programming Reference
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
